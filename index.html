<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consistency Rule Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      font-family: 'Space Grotesk', sans-serif;
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="min-h-screen bg-black flex flex-col items-center justify-center p-6 relative overflow-hidden">
  <!-- Ambient light effects -->
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-white/5 rounded-full blur-3xl"></div>
  <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-white/5 rounded-full blur-3xl"></div>
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-white/5 rounded-full blur-2xl"></div>

  <div class="w-full max-w-md relative z-10">
    <!-- Calculator Card - Liquid Glass -->
    <div class="relative group">
      <!-- Glass reflection effect -->
      <div class="absolute -inset-0.5 bg-gradient-to-b from-white/20 via-transparent to-white/5 rounded-3xl blur-sm opacity-60"></div>
      
      <div class="relative bg-gradient-to-b from-white/10 to-white/5 backdrop-blur-2xl rounded-3xl p-8 border border-white/10 shadow-2xl shadow-black/50">
        <!-- Inner highlight -->
        <div class="absolute inset-0 rounded-3xl bg-gradient-to-br from-white/10 via-transparent to-transparent pointer-events-none"></div>
        
        <div class="relative z-10">
          <h1 class="text-4xl font-bold text-white text-center mb-1 tracking-tight">
            Consistency Rule
          </h1>
          <p class="text-white/50 text-center text-sm font-semibold mb-8 tracking-widest uppercase">
            Calculator
          </p>

          <!-- PnL Input -->
          <div class="mb-6">
            <label class="block text-white/60 text-xs font-bold mb-3 tracking-wider uppercase">
              Biggest End of Day PnL
            </label>
            <div class="relative">
              <div class="absolute -inset-0.5 bg-gradient-to-r from-white/20 to-white/5 rounded-2xl blur-sm opacity-50"></div>
              <div class="relative bg-white/5 backdrop-blur-xl rounded-2xl border border-white/10 overflow-hidden">
                <span class="absolute left-5 top-1/2 -translate-y-1/2 text-white/40 text-2xl font-bold">$</span>
                <input
                  type="number"
                  id="pnlInput"
                  placeholder="1,000"
                  class="w-full bg-transparent py-5 px-14 text-white text-2xl font-bold placeholder-white/20 focus:outline-none"
                />
              </div>
            </div>
          </div>

          <!-- Consistency Percentage Selection -->
          <div class="mb-8">
            <label class="block text-white/60 text-xs font-bold mb-3 tracking-wider uppercase">
              Consistency Percentage
            </label>
            <div class="grid grid-cols-5 gap-2" id="percentButtons">
              <!-- Buttons will be generated by JS -->
            </div>
          </div>

          <!-- Calculate Button -->
          <div class="relative group/btn">
            <div class="absolute -inset-0.5 bg-white/30 rounded-2xl blur opacity-0 group-hover/btn:opacity-50 transition-all duration-500"></div>
            <button
              id="calculateBtn"
              class="relative w-full bg-white text-black font-bold py-5 px-6 rounded-2xl transition-all duration-300 hover:bg-white/90 active:scale-95 overflow-hidden text-lg"
            >
              <div class="absolute inset-0 bg-gradient-to-b from-white/80 to-white rounded-2xl"></div>
              <span class="relative z-10 tracking-wide">Calculate Balance</span>
            </button>
          </div>

          <!-- Result Display -->
          <div id="resultContainer" class="mt-6 relative hidden">
            <div class="absolute -inset-0.5 bg-gradient-to-r from-white/20 to-white/10 rounded-2xl blur-sm"></div>
            <div class="relative p-6 bg-white/5 backdrop-blur-xl rounded-2xl border border-white/20">
              <div class="absolute inset-0 bg-gradient-to-br from-white/10 via-transparent to-transparent rounded-2xl pointer-events-none"></div>
              <p class="text-white/50 text-xs text-center mb-2 tracking-widest uppercase font-bold relative z-10">Total Balance Needed</p>
              <p id="resultAmount" class="text-5xl font-bold text-white text-center tracking-tight relative z-10">
                $0.00
              </p>
            </div>
          </div>

          <!-- Firms Section - Inside Calculator Card -->
          <div class="mt-6 pt-6 border-t border-white/10">
            <h2 class="text-base font-bold text-white text-center mb-4 tracking-tight">
              Firms with the Best Consistency Rules
            </h2>
            
            <div class="flex flex-col gap-3">
              <!-- Lucid Trading Button -->
              <a
                href="https://lucidtrading.com/ref/vedictrades/"
                target="_blank"
                rel="noopener noreferrer"
                class="relative group/link"
              >
                <div class="absolute -inset-0.5 bg-white/20 rounded-xl blur opacity-0 group-hover/link:opacity-50 transition-all duration-500"></div>
                <div class="relative flex items-center justify-between bg-white/5 hover:bg-white/10 backdrop-blur-xl border border-white/10 hover:border-white/20 text-white py-4 px-6 rounded-xl transition-all duration-500">
                  <div class="flex items-center gap-3">
                    <div class="w-3 h-3 rounded-full bg-white"></div>
                    <span class="font-bold text-lg tracking-tight">Lucid Trading</span>
                  </div>
                  <svg class="w-5 h-5 text-white/50 group-hover/link:text-white transition-all duration-300 group-hover/link:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
                  </svg>
                </div>
              </a>
              
              <!-- Tradeify Button -->
              <a
                href="https://tradeify.co/?ref=Vedic"
                target="_blank"
                rel="noopener noreferrer"
                class="relative group/link"
              >
                <div class="absolute -inset-0.5 bg-white/20 rounded-xl blur opacity-0 group-hover/link:opacity-50 transition-all duration-500"></div>
                <div class="relative flex items-center justify-between bg-white/5 hover:bg-white/10 backdrop-blur-xl border border-white/10 hover:border-white/20 text-white py-4 px-6 rounded-xl transition-all duration-500">
                  <div class="flex items-center gap-3">
                    <div class="w-3 h-3 rounded-full bg-white"></div>
                    <span class="font-bold text-lg tracking-tight">Tradeify</span>
                  </div>
                  <svg class="w-5 h-5 text-white/50 group-hover/link:text-white transition-all duration-300 group-hover/link:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
                  </svg>
                </div>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <p class="text-white/30 text-sm text-center mt-8 font-bold tracking-widest uppercase">
      Trade Responsibly
    </p>
  </div>

  <script>
    const percentages = [20, 30, 40, 50, 60];
    let selectedPercent = 20;

    // Generate percentage buttons
    const percentButtonsContainer = document.getElementById('percentButtons');
    
    function renderButtons() {
      percentButtonsContainer.innerHTML = '';
      percentages.forEach(percent => {
        const isSelected = percent === selectedPercent;
        const button = document.createElement('button');
        button.className = `relative py-4 rounded-xl font-bold text-base transition-all duration-500 overflow-hidden ${
          isSelected ? 'text-black' : 'text-white/60 hover:text-white'
        }`;
        button.innerHTML = `
          <div class="absolute inset-0 transition-all duration-500 ${
            isSelected ? 'bg-white' : 'bg-white/5 hover:bg-white/10 border border-white/10'
          } rounded-xl"></div>
          ${isSelected ? '<div class="absolute inset-0 bg-gradient-to-b from-white/50 to-transparent rounded-xl"></div>' : ''}
          <span class="relative z-10">${percent}%</span>
        `;
        button.addEventListener('click', () => {
          selectedPercent = percent;
          renderButtons();
          hideResult();
        });
        percentButtonsContainer.appendChild(button);
      });
    }

    // Initialize buttons
    renderButtons();

    // Calculate functionality
    const pnlInput = document.getElementById('pnlInput');
    const calculateBtn = document.getElementById('calculateBtn');
    const resultContainer = document.getElementById('resultContainer');
    const resultAmount = document.getElementById('resultAmount');

    function hideResult() {
      resultContainer.classList.add('hidden');
    }

    function formatNumber(num) {
      return num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    calculateBtn.addEventListener('click', () => {
      const pnlValue = parseFloat(pnlInput.value);
      
      if (isNaN(pnlValue) || pnlValue <= 0) {
        hideResult();
        return;
      }

      const balanceNeeded = pnlValue / (selectedPercent / 100);
      
      resultAmount.textContent = `$${formatNumber(balanceNeeded)}`;
      resultContainer.classList.remove('hidden');
    });

    pnlInput.addEventListener('input', hideResult);
  </script>
</body>
</html>
